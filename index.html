<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF → PNG folder converter</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#e6e8ec;
    --accent:#2563eb; --accent-2:#1d4ed8; --ok:#15803d; --err:#dc2626; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#171a21; --text:#e8eaed; --muted:#9aa1ad; --line:#272c36;
           --accent:#4f8cff; --accent-2:#3b7bf5; --ok:#4ade80; --err:#f87171; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text); padding:28px 16px 72px;
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;display:grid;gap:16px}
  header h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);max-width:60ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
           margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
       background:var(--accent);color:#fff;font-size:11px;letter-spacing:0}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .btn{
    appearance:none;border:1px solid transparent;border-radius:10px;padding:10px 16px;
    font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;
    transition:background .15s, transform .05s;
  }
  .btn:hover:not(:disabled){background:var(--accent-2)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn.secondary{background:transparent;border-color:var(--line);color:var(--text)}
  .btn.secondary:hover:not(:disabled){background:rgba(127,127,127,.1)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .hint{color:var(--muted);font-size:13px;margin:10px 0 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
  .field select{
    font:inherit;font-weight:400;color:var(--text);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;
  }
  .field.check{display:flex;align-items:center;gap:9px;font-weight:400;color:var(--text);
               font-size:14px;align-self:end;padding-bottom:9px}
  .field.check input{width:16px;height:16px;accent-color:var(--accent)}
  .filelist{list-style:none;margin:12px 0 0;padding:0;max-height:190px;overflow:auto;
            border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:ui-monospace,monospace}
  .filelist li{padding:6px 12px;border-bottom:1px solid var(--line);color:var(--muted);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filelist li:last-child{border-bottom:0}
  .progress{margin-top:16px}
  .bar{height:9px;border-radius:99px;background:rgba(127,127,127,.18);overflow:hidden}
  .bar > div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .18s}
  #status{font-size:13px;color:var(--muted);margin:9px 0 0;font-family:ui-monospace,monospace;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #log{
    margin:14px 0 0;max-height:220px;overflow:auto;background:rgba(127,127,127,.08);
    border-radius:10px;padding:10px 12px;font:12px/1.6 ui-monospace,monospace;
    white-space:pre-wrap;word-break:break-word;
  }
  .ok{color:var(--ok)} .err{color:var(--err)}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>PDF → PNG</h1>
    <p>Pick a folder of PDFs and every page is rendered to a PNG. Everything runs locally in your browser — no uploads, no server.</p>
  </header>

  <section class="card">
    <h2><span class="num">1</span> Input folder</h2>
    <div class="row">
      <button id="pickBtn" class="btn" type="button">Choose folder…</button>
      <input id="fileInput" type="file" webkitdirectory directory multiple accept=".pdf,application/pdf" hidden>
      <span id="fileSummary" class="hint">No folder selected.</span>
    </div>
    <ul id="fileList" class="filelist" hidden></ul>
  </section>

  <section class="card">
    <h2><span class="num">2</span> Options</h2>
    <div class="grid">
      <label class="field">
        <span>Resolution</span>
        <select id="dpi">
          <option value="72">72 DPI — screen / small</option>
          <option value="150" selected>150 DPI — balanced</option>
          <option value="200">200 DPI — sharp</option>
          <option value="300">300 DPI — print</option>
          <option value="600">600 DPI — huge files</option>
        </select>
      </label>
      <label class="field">
        <span>Output</span>
        <select id="outMode">
          <option value="folder">Save straight into a folder I pick</option>
          <option value="zip">Download everything as one .zip</option>
        </select>
      </label>
      <label class="field check">
        <input type="checkbox" id="whiteBg" checked>
        <span>White background (off = transparent)</span>
      </label>
      <label class="field check">
        <input type="checkbox" id="keepStructure" checked>
        <span>Mirror sub-folder structure</span>
      </label>
    </div>
    <p id="modeHint" class="hint"></p>
  </section>

  <section class="card">
    <h2><span class="num">3</span> Convert</h2>
    <div class="actions">
      <button id="convertBtn" class="btn" type="button" disabled>Convert</button>
      <button id="cancelBtn" class="btn secondary" type="button" hidden>Cancel</button>
    </div>
    <div id="progress" class="progress" hidden>
      <div class="bar"><div id="barFill"></div></div>
      <p id="status">Starting…</p>
    </div>
    <pre id="log" hidden></pre>
  </section>

</div>

<script type="module">
const $ = (s) => document.querySelector(s);

const PDFJS_VER = '4.7.76';
const CDN = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VER}`;

const el = {
  pickBtn:    $('#pickBtn'),
  fileInput:  $('#fileInput'),
  summary:    $('#fileSummary'),
  list:       $('#fileList'),
  dpi:        $('#dpi'),
  outMode:    $('#outMode'),
  whiteBg:    $('#whiteBg'),
  keepStruct: $('#keepStructure'),
  modeHint:   $('#modeHint'),
  convertBtn: $('#convertBtn'),
  cancelBtn:  $('#cancelBtn'),
  progress:   $('#progress'),
  barFill:    $('#barFill'),
  status:     $('#status'),
  log:        $('#log'),
};

const state = { files: [], running: false, cancel: false };

/* ------------------------------------------------------------------ boot */

let pdfjsLib = null;
let JSZipLib = null;

(async function boot() {
  try {
    pdfjsLib = await import(`${CDN}/build/pdf.min.mjs`);
    pdfjsLib.GlobalWorkerOptions.workerSrc = `${CDN}/build/pdf.worker.min.mjs`;
  } catch (e) {
    el.summary.textContent = 'Could not load the PDF engine — check your internet connection and reload.';
    return;
  }
  if (!window.showDirectoryPicker) {
    const opt = el.outMode.querySelector('option[value="folder"]');
    opt.disabled = true;
    opt.textContent = 'Save to folder (Chrome / Edge only)';
    el.outMode.value = 'zip';
  }
  updateModeHint();
})();

el.outMode.addEventListener('change', updateModeHint);

function updateModeHint() {
  el.modeHint.textContent = el.outMode.value === 'folder'
    ? 'You will be asked for an output folder. PNGs are written there directly (files with the same name are overwritten).'
    : 'All PNGs are packed into a single .zip that your browser downloads when finished.';
}

/* --------------------------------------------------------- folder picking */

el.pickBtn.addEventListener('click', () => el.fileInput.click());

el.fileInput.addEventListener('change', (e) => {
  const picked = [...e.target.files].filter(f => /\.pdf$/i.test(f.name));
  state.files = picked.sort((a, b) =>
    (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));

  if (!state.files.length) {
    el.summary.textContent = 'No PDF files found in that folder.';
    el.list.hidden = true;
    el.convertBtn.disabled = true;
    return;
  }

  const bytes = state.files.reduce((n, f) => n + f.size, 0);
  el.summary.textContent = `${state.files.length} PDF${state.files.length > 1 ? 's' : ''} · ${fmtBytes(bytes)}`;
  el.convertBtn.disabled = false;

  el.list.innerHTML = '';
  const show = state.files.slice(0, 300);
  for (const f of show) {
    const li = document.createElement('li');
    li.textContent = f.webkitRelativePath || f.name;
    el.list.appendChild(li);
  }
  if (state.files.length > show.length) {
    const li = document.createElement('li');
    li.textContent = `…and ${state.files.length - show.length} more`;
    el.list.appendChild(li);
  }
  el.list.hidden = false;
});

/* -------------------------------------------------------------- converting */

el.convertBtn.addEventListener('click', () => convert().catch(err => {
  log(`✗ Fatal: ${err.message}`, 'err');
  setRunning(false);
}));

el.cancelBtn.addEventListener('click', () => {
  state.cancel = true;
  el.cancelBtn.disabled = true;
  setStatus('Cancelling after the current page…');
});

async function convert() {
  if (state.running || !state.files.length) return;

  const dpi = Number(el.dpi.value) || 150;
  const scale = dpi / 72;
  const whiteBg = el.whiteBg.checked;
  const keepStruct = el.keepStruct.checked;
  const mode = el.outMode.value;

  /* output target */
  let outRoot = null;
  if (mode === 'folder') {
    try {
      outRoot = await window.showDirectoryPicker({ id: 'pdf2png-out', mode: 'readwrite' });
    } catch (err) {
      if (err.name !== 'AbortError') log(`✗ Folder picker: ${err.message}`, 'err');
      return;
    }
  }

  setRunning(true);
  clearLog();
  el.progress.hidden = false;
  el.log.hidden = false;
  setProgress(0, 'Preparing…');

  let zip = null;
  if (mode === 'zip') {
    if (!JSZipLib) {
      setStatus('Loading ZIP library…');
      await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      JSZipLib = window.JSZip;
    }
    zip = new JSZipLib();
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  let pagesDone = 0, filesDone = 0, failed = 0;

  for (let i = 0; i < state.files.length; i++) {
    if (state.cancel) break;

    const file = state.files[i];
    const rel = file.webkitRelativePath || file.name;
    const segs = rel.split('/');
    const base = segs.pop().replace(/\.pdf$/i, '');
    const dirs = keepStruct ? segs : [];

    let doc;
    try {
      setStatus(`${rel} — opening…`);
      const buf = await file.arrayBuffer();
      doc = await pdfjsLib.getDocument({
        data: buf,
        cMapUrl: `${CDN}/cmaps/`,
        cMapPacked: true,
        standardFontDataUrl: `${CDN}/standard_fonts/`,
      }).promise;
    } catch (err) {
      failed++;
      log(`✗ ${rel} — ${err.name === 'PasswordException' ? 'password protected' : err.message}`, 'err');
      continue;
    }

    const total = doc.numPages;
    let dirHandle = null;
    try {
      if (outRoot) dirHandle = await ensureDir(outRoot, dirs);
    } catch (err) {
      log(`✗ Cannot create output folder for ${rel} — ${err.message}`, 'err');
    }

    for (let p = 1; p <= total; p++) {
      if (state.cancel) break;
      try {
        const page = await doc.getPage(p);
        const viewport = page.getViewport({ scale });

        canvas.width  = Math.max(1, Math.floor(viewport.width));
        canvas.height = Math.max(1, Math.floor(viewport.height));
        if (whiteBg) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        await page.render({ canvasContext: ctx, viewport }).promise;
        const blob = await canvasToBlob(canvas);

        const name = `${safe(base)}-page-${String(p).padStart(3, '0')}.png`;
        if (dirHandle) {
          await writeFile(dirHandle, name, blob);
        } else {
          zip.file([...dirs, name].join('/'), blob);
        }

        page.cleanup();
        pagesDone++;
        setProgress((i + p / total) / state.files.length, `${rel} — page ${p}/${total}`);
      } catch (err) {
        log(`✗ ${rel} page ${p} — ${err.message}`, 'err');
      }
    }

    filesDone++;
    try { await doc.destroy(); } catch { /* ignore */ }
  }

  /* finish up */
  if (state.cancel) {
    log('Cancelled — partial output kept.', 'err');
    setStatus('Cancelled.');
  } else {
    setProgress(1, 'Done.');
    log(`✓ ${filesDone} file${filesDone === 1 ? '' : 's'}, ${pagesDone} page${pagesDone === 1 ? '' : 's'}${failed ? `, ${failed} failed` : ''}.`, 'ok');

    if (mode === 'zip' && zip && Object.keys(zip.files).length) {
      setStatus('Building ZIP…');
      const blob = await zip.generateAsync(
        { type: 'blob', compression: 'STORE' },
        (m) => setStatus(`Building ZIP… ${Math.round(m.percent)}%`)
      );
      downloadBlob(blob, `pdf-to-png-${stamp()}.zip`);
      setStatus(`Done — ${fmtBytes(blob.size)} ZIP downloaded.`);
    } else {
      setStatus(`Done — PNGs saved to the folder you picked.`);
    }
  }

  setRunning(false);
}

/* ---------------------------------------------------------------- helpers */

function setRunning(on) {
  state.running = on;
  if (!on) state.cancel = false;
  el.convertBtn.disabled = on || !state.files.length;
  el.pickBtn.disabled = on;
  el.cancelBtn.hidden = !on;
  el.cancelBtn.disabled = false;
}

function setProgress(fraction, text) {
  el.progress.hidden = false;
  el.barFill.style.width = `${Math.round(Math.min(1, Math.max(0, fraction)) * 100)}%`;
  if (text !== undefined) setStatus(text);
}

function setStatus(text) { el.status.textContent = text; }

function clearLog() { el.log.textContent = ''; }

function log(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  el.log.appendChild(span);
  el.log.scrollTop = el.log.scrollHeight;
  while (el.log.childElementCount > 600) el.log.firstElementChild.remove();
}

function canvasToBlob(canvas) {
  return new Promise((res, rej) =>
    canvas.toBlob(b => b ? res(b) : rej(new Error('canvas.toBlob returned null (image too large?)')), 'image/png'));
}

function safe(name) {
  const cleaned = String(name)
    .replace(/[<>:"\\|?*\u0000-\u001f]/g, '_')
    .replace(/^\.+/, '_')
    .trim()
    .slice(0, 120);
  return cleaned || 'unnamed';
}

async function ensureDir(root, parts) {
  let dir = root;
  for (const part of parts) {
    if (!part || part === '.') continue;
    dir = await dir.getDirectoryHandle(safe(part), { create: true });
  }
  return dir;
}

async function writeFile(dirHandle, name, blob) {
  const handle = await dirHandle.getFileHandle(name, { create: true });
  const writable = await handle.createWritable();
  await writable.write(blob);
  await writable.close();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error(`Failed to load ${src}`));
    document.head.appendChild(s);
  });
}

function fmtBytes(n) {
  if (n < 1024) return `${n} B`;
  const u = ['KB', 'MB', 'GB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return `${n.toFixed(n < 10 ? 1 : 0)} ${u[i]}`;
}

function stamp() {
  const d = new Date();
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
</script>
</body>
</html>
